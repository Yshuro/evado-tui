name: Feature request
description: Suggest something the TUI or CLI could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, in your own words. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Keys, commands or flags are welcome but not required.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
